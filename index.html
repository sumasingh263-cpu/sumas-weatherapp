<!DOCTYPE html>

    <meta charset="UTF-8">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyPulse Weather</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="sky-background">
    <div class="weather-container">
        <header>
            <h1><i class="fa-solid fa-cloud-sun"></i> SkyPulse Weather</h1>
            <div class="search-box">
                <input type="text" id="city-input" placeholder="Search city...">
                <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </header>

        <main id="weather-display">
            <div class="current-weather">
                <div class="location-info">
                    <h2 id="city-name">Loading...</h2>
                    <p id="date-time">--</p>
                </div>
                <div class="temp-condition">
                    <div class="temp-box">
                        <span id="temperature">--°C</span>
                        <p id="condition">--</p>
                    </div>
                    <div class="weather-icon-anim" id="weather-icon">
                        <i class="fa-solid fa-sun"></i>
                    </div>
                </div>
            </div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <span>Wind Speed</span>
                        <h3 id="wind-speed">-- km/h</h3>
                    </div>
                </div>
                <div class="metric-card">
                    <i class="fa-solid fa-droplet"></i>
                    <div>
                        <span>Humidity</span>
                        <h3 id="humidity">--%</h3>
                    </div>
                </div>
                <div class="metric-card">
                    <i class="fa-solid fa-sun"></i>
                    <div>
                        <span>UV Index</span>
                        <h3 id="uv-index">--</h3>
                    </div>
                </div>
                <div class="metric-card">
                    <i class="fa-solid fa-lungs"></i>
                    <div>
                        <span>Air Quality (AQI)</span>
                        <h3 id="aqi">--</h3>
                    </div>
                </div>
                <div class="metric-card">
                    <i class="fa-solid fa-moon"></i>
                    <div>
                        <span>Sunset</span>
                        <h3 id="sunset-time">--:--</h3>
                    </div>
                </div>
            </div>

            <div class="hourly-section">
                <h3>Hourly Forecast</h3>
                <div class="hourly-container" id="hourly-container">
                    <!-- Hourly items dynamically loaded -->
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
