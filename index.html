<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherNow</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <div class="container">
        <h1><i class="fa-solid fa-cloud-sun"></i> WeatherNow</h1>
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Search city...">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            <button id="geo-btn" title="Use current location"><i class="fa-solid fa-location-crosshairs"></i></button>
        </div>
        <div class="recent-searches">
            <span>Recent Searches</span>
            <div id="recent-list"></div>
        </div>
        <div id="weather-card" class="weather-card hidden">
            <h2 id="city-name"></h2>
            <div class="weather-icon"><i id="weather-icon-i" class="fa-solid fa-sun"></i></div>
            <p id="weather-desc" class="desc"></p>
            <h3 id="temp"></h3>
            <p id="high-low" class="high-low"></p>
            
            <div class="details-grid">
                <div class="detail-item"><i class="fa-solid fa-droplet"></i> <span id="humidity"></span></div>
                <div class="detail-item"><i class="fa-solid fa-wind"></i> <span id="wind"></span></div>
            </div>

            <!-- Environmental Health Metrics -->
            <div class="env-container">
                <div class="env-card">
                    <i class="fa-solid fa-lungs"></i>
                    <div>
                        <small>AQI (Air Quality)</small>
                        <span id="aqi-val">--</span>
                    </div>
                </div>
                <div class="env-card">
                    <i class="fa-solid fa-sun-plant-wilt"></i>
                    <div>
                        <small>UV Index</small>
                        <span id="uv-val">--</span>
                    </div>
                </div>
            </div>

            <!-- Smart Recommendations -->
            <div class="recommendations-box">
                <h3><i class="fa-solid fa-lightbulb"></i> Smart Recommendations</h3>
                <p id="rec-text">Loading recommendations...</p>
            </div>

            <div class="sun-times">
                <div><i class="fa-solid fa-sunrise"></i> <span id="sunrise"></span></div>
                <div><i class="fa-solid fa-sunset"></i> <span id="sunset"></span></div>
            </div>

            <div class="hourly-section">
                <h3>Hourly Weather</h3>
                <div id="hourly-container" class="hourly-container"></div>
            </div>

            <div class="forecast-section">
                <h3>5-Day Forecast</h3>
                <div id="forecast-container" class="forecast-container"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
